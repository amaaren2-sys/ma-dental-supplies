<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>لوحة التحكم | MA Dental Supplies</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body class="admin-wrap">
<div id="loginView" class="login"><h1>MA Dental Supplies</h1><p>دخول لوحة التحكم</p>
<form id="loginForm"><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></div>
<div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required></div>
<button class="btn primary" style="width:100%;margin-top:15px">دخول</button></form>
<p id="loginError" style="color:#a62e50;font-size:10px"></p><button id="forgotBtn" class="btn outline small" type="button">نسيت كلمة المرور؟</button><div id="resetBox" style="display:none;margin-top:12px"><input id="resetEmail" type="email" placeholder="بريد الحساب" style="width:100%;padding:9px;border:1px solid #ddd7e8;border-radius:8px"><button id="sendReset" class="btn primary small" type="button" style="margin-top:8px">إرسال رابط الاستعادة</button></div></div>
<div id="adminView" style="display:none"><div class="admin-nav"><strong>MA Dental Supplies — لوحة التحكم</strong><button class="btn outline small" id="logout">تسجيل الخروج</button></div>
<main class="admin"><div class="dash-grid" id="stats"></div>
<div id="orderModal" class="order-modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="orderModalTitle">
  <div class="order-modal-card">
    <div class="order-modal-head"><h3 id="orderModalTitle">تفاصيل الطلب</h3><button class="btn outline small" id="closeOrderModal" type="button">إغلاق</button></div>
    <div id="orderModalBody"></div>
  </div>
</div>
<section class="admin-section"><div class="head"><h2>إضافة منتج</h2></div>
<form class="admin-form" id="productForm">
<input name="name" placeholder="اسم المنتج" required><input name="brand" placeholder="العلامة التجارية">
<select name="category"><option value="المواد">المواد</option><option value="البكجات">البكجات</option></select>
<input name="price" type="number" step="0.01" placeholder="السعر" required><input name="stock" type="number" placeholder="المخزون" value="0">
<input name="icon" placeholder="إيموجي احتياطي" value="🦷">
<div class="image-upload"><label>صورة المنتج</label><input name="image" id="productImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><small>اختر JPG أو PNG أو WEBP. الصورة ترفع إلى Supabase تلقائيًا.</small><img id="imagePreview" class="admin-image-preview" alt="معاينة الصورة" style="display:none"></div>
<textarea name="description" placeholder="وصف المنتج"></textarea><label style="font-size:10px"><input name="featured" type="checkbox"> الأكثر طلبًا</label>
<button class="btn primary" id="addProductBtn">إضافة المنتج</button><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn outline small" id="exportProducts">تصدير المنتجات CSV</button><label class="btn outline small" style="cursor:pointer">استيراد CSV<input id="importProducts" type="file" accept=".csv,text/csv" hidden></label></div></form></section>
<section class="admin-section"><div class="head"><h2>المنتجات</h2><div style="display:flex;gap:8px;align-items:center"><input id="adminProductSearch" placeholder="بحث بالمنتج أو الشركة" style="padding:8px;border:1px solid #ddd7e8;border-radius:8px;font-size:9px"><button class="btn outline small" id="reloadProducts">تحديث</button></div></div>
<div class="table-wrap"><table class="table"><thead><tr><th>الصورة</th><th>المنتج</th><th>السعر</th><th>المخزون</th><th>القسم</th><th>إجراءات</th></tr></thead><tbody id="productsTable"></tbody></table></div></section>
<section class="admin-section"><div class="head"><h2>الطلبات</h2><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input id="adminOrderSearch" placeholder="بحث برقم الطلب أو الاسم" style="padding:8px;border:1px solid #ddd7e8;border-radius:8px;font-size:9px"><button class="btn outline small" id="reloadOrders">تحديث</button><button class="btn primary small" id="exportOrdersExcel" type="button">📊 Excel اليوم</button><button class="btn outline small" id="printOrdersPdf" type="button">📄 PDF اليوم</button></div></div>
<div class="table-wrap"><table class="table"><thead><tr><th>الطلب</th><th>العميل</th><th>المكان</th><th>الإجمالي</th><th>الحالة</th><th>التفاصيل</th><th>إجراء</th></tr></thead><tbody id="ordersTable"></tbody></table></div></section>
</main></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="supabase-client.js"></script>
<script>
const $=s=>document.querySelector(s), money=n=>"$"+Number(n).toFixed(2);
const statuses=["جديد","قيد التجهيز","جاهز للتسليم","تم التسليم","ملغى"];
let productsCache=[];
function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function slugify(s){return String(s).trim().toLowerCase().replace(/[^\w\u0600-\u06ff]+/g,"-")+"-"+Date.now().toString(36)}
async function requireUser(){const {data}=await sb.auth.getSession();return data.session?.user||null}
async function uploadImage(file,productId){
  if(!file)return "";
  if(file.size>5*1024*1024)throw new Error("حجم الصورة يجب أن يكون أقل من 5MB");
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  const path=`${productId}/${Date.now()}-${crypto.randomUUID()}.${ext}`;
  const {error}=await sb.storage.from('product-images').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||'image/jpeg'});
  if(error)throw error;
  const {data}=sb.storage.from('product-images').getPublicUrl(path);
  return data.publicUrl;
}
function previewFile(file){const img=$("#imagePreview");if(!file){img.style.display='none';img.removeAttribute('src');return}img.src=URL.createObjectURL(file);img.style.display='block'}
async function load(){
 const {data:p,error:pe}=await sb.from("products").select("*").order("created_at",{ascending:false});if(pe)throw pe;
 const {data:o,error:oe}=await sb.from("orders").select("*,order_items(*)").order("created_at",{ascending:false});if(oe)throw oe;
 const orders=o||[], products=p||[];productsCache=products;
 const revenue=orders.filter(x=>x.status!=="ملغى").reduce((s,x)=>s+Number(x.total),0),pending=orders.filter(x=>x.status==="جديد").length;
 $("#stats").innerHTML=`<div class="stat"><small>المنتجات</small><strong>${products.length}</strong></div><div class="stat"><small>كل الطلبات</small><strong>${orders.length}</strong></div><div class="stat"><small>طلبات جديدة</small><strong>${pending}</strong></div><div class="stat"><small>إجمالي الطلبات</small><strong>${money(revenue)}</strong></div>`;
 $("#productsTable").innerHTML=products.map(x=>`<tr><td>${x.image_url?`<img class="table-product-image" src="${esc(x.image_url)}" alt="${esc(x.name)}">`:esc(x.icon||"🦷")}</td><td>${esc(x.name)}<br><small>${esc(x.brand||"")}</small></td><td>${money(x.price)}</td><td>${x.stock}</td><td>${esc(x.category)}</td><td><div class="admin-actions"><button class="btn small outline" onclick="editProduct('${x.id}')">تعديل</button><button class="btn small danger" onclick="deleteProduct('${x.id}')">حذف</button></div></td></tr>`).join("");
 $("#ordersTable").innerHTML=orders.map(x=>`<tr><td><b>${esc(x.id)}</b><br><small>${new Date(x.created_at).toLocaleString("ar-SY")}</small></td><td>${esc(x.customer_name)}<br>${esc(x.customer_phone)}</td><td>${esc(x.customer_location)}</td><td>${money(x.total)}</td><td><select class="status" onchange="setStatus('${x.id}',this.value)">${statuses.map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select></td><td><button class="btn small outline" type="button" onclick="showOrder('${x.id}')">👁️ تفاصيل الطلب</button></td><td><button class="btn small danger" type="button" onclick="deleteOrder('${x.id}')">حذف</button></td></tr>`).join("");
 window.__orders=orders;
 window.__products=products;
 renderAdminFilters();
}
function renderAdminFilters(){
 const ps=productsCache||[], pq=(document.getElementById("adminProductSearch")?.value||"").toLowerCase();
 const os=window.__orders||[], oq=(document.getElementById("adminOrderSearch")?.value||"").toLowerCase();
 const fp=ps.filter(x=>`${x.name} ${x.brand} ${x.category}`.toLowerCase().includes(pq));
 const fo=os.filter(x=>`${x.id} ${x.customer_name} ${x.customer_phone} ${x.customer_location}`.toLowerCase().includes(oq));
 $("#productsTable").innerHTML=fp.map(x=>`<tr><td>${x.image_url?`<img class="table-product-image" src="${esc(x.image_url)}" alt="${esc(x.name)}">`:esc(x.icon||"🦷")}</td><td>${esc(x.name)}<br><small>${esc(x.brand||"")}</small></td><td>${money(x.price)}</td><td>${x.stock<=5?`<b class="stock-low">${x.stock} ⚠️</b>`:x.stock}</td><td>${esc(x.category)}</td><td><div class="admin-actions"><button class="btn small outline" onclick="editProduct('${x.id}')">تعديل</button><button class="btn small danger" onclick="deleteProduct('${x.id}')">حذف</button></div></td></tr>`).join("");
 $("#ordersTable").innerHTML=fo.map(x=>`<tr><td><b>${esc(x.id)}</b><br><small>${new Date(x.created_at).toLocaleString("ar-SY")}</small></td><td>${esc(x.customer_name)}<br>${esc(x.customer_phone)}</td><td>${esc(x.customer_location)}</td><td>${money(x.total)}</td><td><select class="status" onchange="setStatus('${x.id}',this.value)">${statuses.map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select></td><td><button class="btn small outline" type="button" onclick="showOrder('${x.id}')">👁️ تفاصيل الطلب</button></td><td><button class="btn small danger" type="button" onclick="deleteOrder('${x.id}')">حذف</button></td></tr>`).join("");
}

function csvCell(v){const x=String(v??"").replace(/"/g,'""');return `"${x}"`}
function exportProducts(){const headers=['id','name','brand','category','price','stock','rating','description','featured','image_url'];const rows=(productsCache||[]).map(p=>headers.map(h=>csvCell(p[h])).join(','));const blob=new Blob(['\ufeff'+[headers.join(','),...rows].join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ma-products.csv';a.click();URL.revokeObjectURL(a.href)}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++;continue}if(c==='"'){quoted=!quoted;continue}if(c===','&&!quoted){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell='';continue}cell+=c}if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows}
async function importProducts(file){const text=await file.text(),rows=parseCSV(text);if(rows.length<2)return alert('ملف CSV فارغ أو غير صالح');const headers=rows[0].map(x=>x.trim());const allowed=['id','name','brand','category','price','stock','rating','description','featured','image_url'];const payload=rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??'']))).filter(x=>x.name).map(x=>({id:x.id||'p'+crypto.randomUUID().replaceAll('-',''),name:x.name.trim(),slug:slugify(x.name),brand:x.brand||'',category:x.category==='البكجات'?'البكجات':'المواد',price:Number(x.price)||0,stock:Math.max(0,Math.floor(Number(x.stock)||0)),rating:Number(x.rating)||5,description:x.description||'',featured:String(x.featured).toLowerCase()==='true',image_url:x.image_url||''}));if(!payload.length)return alert('لا توجد منتجات صالحة');const {error}=await sb.from('products').upsert(payload,{onConflict:'id'});if(error)return alert(error.message);await load();alert(`تم استيراد ${payload.length} منتج ✓`)}
async function editProduct(id){
 const d=productsCache.find(x=>x.id===id);if(!d)return;
 try{
  const name=prompt("اسم المنتج",d.name);if(name===null)return;
  const brand=prompt("العلامة التجارية",d.brand||"");if(brand===null)return;
  const category=prompt("القسم: المواد أو البكجات",d.category||"المواد");if(category===null)return;
  const price=prompt("السعر",d.price);if(price===null)return;
  const stock=prompt("المخزون",d.stock);if(stock===null)return;
  const rating=prompt("التقييم من 5",d.rating??5);if(rating===null)return;
  const icon=prompt("الإيموجي الاحتياطي",d.icon||"🦷");if(icon===null)return;
  const description=prompt("تفاصيل المنتج / الوصف",d.description||"");if(description===null)return;
  const featured=confirm("هل تريد إبقاء/تفعيل المنتج كـ الأكثر طلبًا؟");
  let image_url=d.image_url||"";
  if(confirm("هل تريد تغيير صورة المنتج؟")){
   const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='image/jpeg,image/png,image/webp,image/gif';fileInput.click();
   await new Promise(resolve=>fileInput.onchange=resolve);
   if(fileInput.files[0]) image_url=await uploadImage(fileInput.files[0],id);
  }
  const cleanCategory=category.trim()==="البكجات"?"البكجات":"المواد";
  const payload={name:name.trim(),brand:brand.trim(),category:cleanCategory,price:Number(price)||0,stock:Math.max(0,Math.floor(Number(stock)||0)),rating:Math.min(5,Math.max(0,Number(rating)||5)),icon:icon.trim()||"🦷",description:description.trim(),featured,image_url,slug:slugify(name)};
  const {error:e}=await sb.from("products").update(payload).eq("id",id);
  if(e)throw e;
  await load();alert("تم تعديل المنتج بنجاح ✓");
 }catch(e){console.error(e);alert("تعذر تعديل المنتج: "+(e.message||e))}
}
async function deleteProduct(id){if(!confirm("حذف المنتج؟"))return;const {error}=await sb.from("products").delete().eq("id",id);if(error)throw error;await load()}
function showOrder(id){
 const order=(window.__orders||[]).find(x=>x.id===id);if(!order)return;
 const items=Array.isArray(order.order_items)?order.order_items:[];
 const rows=items.length?items.map(i=>`<tr><td>${esc(i.product_name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td><strong>${money(Number(i.price)*Number(i.qty))}</strong></td></tr>`).join(""):"<tr><td colspan=4>لا توجد تفاصيل منتجات لهذا الطلب.</td></tr>";
 $("#orderModalTitle").textContent=`تفاصيل الطلب ${order.id}`;
 $("#orderModalBody").innerHTML=`<div class="order-customer-grid"><div><small>العميل</small><strong>${esc(order.customer_name)}</strong></div><div><small>الهاتف</small><strong>${esc(order.customer_phone)}</strong></div><div><small>مكان الاستلام</small><strong>${esc(order.customer_location)}</strong></div><div><small>الحالة</small><strong>${esc(order.status)}</strong></div></div><div class="order-items-wrap"><table class="table order-items-table"><thead><tr><th>المنتج</th><th>الكمية</th><th>سعر الوحدة</th><th>المجموع</th></tr></thead><tbody>${rows}</tbody></table></div><div class="order-total"><span>الإجمالي النهائي</span><strong>${money(order.total)}</strong></div><div class="order-notes"><small>ملاحظات الزبون</small><p>${order.notes?esc(order.notes):"لا توجد ملاحظات."}</p></div>`;
 $("#orderModal").style.display="flex";
}
function closeOrderModal(){$("#orderModal").style.display="none"}
$("#closeOrderModal").onclick=closeOrderModal;
$("#orderModal").onclick=e=>{if(e.target.id==="orderModal")closeOrderModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeOrderModal()});
$("adminProductSearch")?.addEventListener("input",renderAdminFilters);$("adminOrderSearch")?.addEventListener("input",renderAdminFilters);
$("forgotBtn")?.addEventListener("click",()=>{$("resetBox").style.display=$("resetBox").style.display==="none"?"block":"none"});
$("sendReset")?.addEventListener("click",async()=>{const email=$("resetEmail").value.trim();if(!email)return alert("اكتب البريد الإلكتروني");const redirect=location.origin+location.pathname;const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirect});if(error)return alert(error.message);alert("تم إرسال رابط استعادة كلمة المرور إلى بريدك.")});
sb.auth.onAuthStateChange(async(event,session)=>{if(event==="PASSWORD_RECOVERY"&&session){const np=prompt("أدخل كلمة المرور الجديدة:");if(np&&np.length>=6){const {error}=await sb.auth.updateUser({password:np});alert(error?error.message:"تم تغيير كلمة المرور بنجاح ✓")}}});
function todayOrders(){
 const orders=Array.isArray(window.__orders)?window.__orders:[];
 const now=new Date(), y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
 return orders.filter(o=>{const dt=new Date(o.created_at);return dt.getFullYear()===y&&dt.getMonth()===m&&dt.getDate()===d;});
}
function orderRowsForExport(orders){
 const rows=[];
 orders.forEach(o=>{
  const items=Array.isArray(o.order_items)?o.order_items:[];
  if(!items.length){rows.push({"رقم الطلب":o.id,"التاريخ":new Date(o.created_at).toLocaleString("ar-SY"),"العميل":o.customer_name,"الهاتف":o.customer_phone,"المكان":o.customer_location,"الحالة":o.status,"المنتج":"","الكمية":"","سعر الوحدة":Number(o.total)||0,"مجموع المنتج":Number(o.total)||0,"ملاحظات":o.notes||""});return;}
  items.forEach(i=>rows.push({"رقم الطلب":o.id,"التاريخ":new Date(o.created_at).toLocaleString("ar-SY"),"العميل":o.customer_name,"الهاتف":o.customer_phone,"المكان":o.customer_location,"الحالة":o.status,"المنتج":i.product_name,"الكمية":i.qty,"سعر الوحدة":Number(i.price)||0,"مجموع المنتج":(Number(i.price)||0)*(Number(i.qty)||0),"ملاحظات":o.notes||""}));
 });
 return rows;
}
function exportOrdersExcel(){
 const orders=todayOrders();
 if(!orders.length)return alert("لا توجد طلبات اليوم لتصديرها.");
 if(typeof XLSX==="undefined")return alert("تعذر تحميل أداة Excel. تأكد من اتصال الإنترنت ثم أعد المحاولة.");
 const rows=orderRowsForExport(orders), ws=XLSX.utils.json_to_sheet(rows);
 ws["!cols"]=[{wch:14},{wch:20},{wch:20},{wch:16},{wch:18},{wch:16},{wch:30},{wch:10},{wch:14},{wch:16},{wch:30}];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"طلبات اليوم");
 XLSX.writeFile(wb,`MA-Dental-Supplies-Orders-${new Date().toISOString().slice(0,10)}.xlsx`);
}
function printOrdersPdf(){
 const orders=todayOrders();
 if(!orders.length)return alert("لا توجد طلبات اليوم لطباعة ملف PDF.");
 const rows=orders.map(o=>{const items=Array.isArray(o.order_items)?o.order_items:[];const products=items.length?items.map(i=>`${esc(i.product_name)} × ${i.qty}`).join("<br>"):"—";return `<tr><td>${esc(o.id)}</td><td>${new Date(o.created_at).toLocaleTimeString("ar-SY",{hour:"2-digit",minute:"2-digit"})}</td><td>${esc(o.customer_name)}<br>${esc(o.customer_phone)}</td><td>${esc(o.customer_location)}</td><td>${products}</td><td>${esc(o.status)}</td><td>${money(o.total)}</td><td>${o.notes?esc(o.notes):"—"}</td></tr>`}).join("");
 const date=new Date().toLocaleDateString("ar-SY");
 const w=window.open("","_blank","width=1200,height=800");
 if(!w)return alert("يرجى السماح بالنوافذ المنبثقة حتى تتمكن من إنشاء ملف PDF.");
 w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>طلبات MA Dental Supplies - ${date}</title><style>body{font-family:Arial,sans-serif;margin:24px;color:#222}h1{margin:0 0 6px;font-size:22px}p{margin:0 0 18px;color:#666}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #bbb;padding:7px;vertical-align:top;text-align:right}th{background:#f1f1f1}tfoot td{font-weight:700}@media print{body{margin:10mm}button{display:none}}</style></head><body><h1>MA Dental Supplies — طلبات اليوم</h1><p>${date} — عدد الطلبات: ${orders.length}</p><table><thead><tr><th>رقم الطلب</th><th>الوقت</th><th>العميل / الهاتف</th><th>المكان</th><th>المنتجات والكمية</th><th>الحالة</th><th>الإجمالي</th><th>الملاحظات</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="6">إجمالي الطلبات</td><td>${money(orders.reduce((s,o)=>s+Number(o.total||0),0))}</td><td></td></tr></tfoot></table><script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);
 w.document.close();
}
async function setStatus(id,status){const {error}=await sb.from("orders").update({status}).eq("id",id);if(error)alert(error.message);else load()}

 e.preventDefault();
 const btn=e.submitter||$("#loginForm button[type=submit]");
 const email=$("#email").value.trim().toLowerCase();
 const password=$("#password").value;
 const errorBox=$("#loginError");
 errorBox.textContent="";
 if(!email||!password){errorBox.textContent="أدخل البريد الإلكتروني وكلمة المرور.";return}
 if(btn){btn.disabled=true;btn.textContent="جارٍ تسجيل الدخول..."}
 try{
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error)throw error;
  if(!data?.session)throw new Error("تعذر إنشاء جلسة الدخول. أعد المحاولة.");
  await boot();
 }catch(err){
  console.error("MA Admin login error:",err);
  const msg=String(err?.message||err||"");
  errorBox.textContent=msg.includes("Invalid login credentials")||msg.includes("invalid login credentials")
   ?"بيانات الدخول غير صحيحة. تأكد من البريد وكلمة المرور ثم حاول مرة أخرى."
   :msg;
 }finally{
  if(btn){btn.disabled=false;btn.textContent="دخول"}
 }
};
