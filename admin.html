<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم | MA Dental Supplies</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Montserrat:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body class="admin-wrap"><div id="loginView" class="login"><h1>MA Dental Supplies</h1><p>دخول لوحة التحكم</p><form id="loginForm"><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required></div><button class="btn primary" style="width:100%;margin-top:15px">دخول</button></form><p id="loginError" style="color:#a62e50;font-size:10px"></p></div><div id="adminView" style="display:none"><div class="admin-nav"><strong>MA Dental Supplies — لوحة التحكم</strong><button class="btn outline small" id="logout">تسجيل الخروج</button></div><main class="admin"><div class="dash-grid" id="stats"></div><section class="admin-section"><div class="head"><h2>إضافة منتج</h2></div><form class="admin-form" id="productForm"><input name="name" placeholder="اسم المنتج" required><input name="brand" placeholder="العلامة التجارية"><input name="category" placeholder="القسم: المواد أو البكجات" value="المواد"><input name="price" type="number" step="0.01" placeholder="السعر" required><input name="stock" type="number" placeholder="المخزون" value="0"><input name="icon" placeholder="إيموجي المنتج" value="🦷"><textarea name="description" placeholder="وصف المنتج"></textarea><label style="font-size:10px"><input name="featured" type="checkbox"> الأكثر طلبًا</label><button class="btn primary">إضافة المنتج</button></form></section><section class="admin-section"><div class="head"><h2>المنتجات</h2><button class="btn outline small" id="reloadProducts">تحديث</button></div><div class="table-wrap"><table class="table"><thead><tr><th>المنتج</th><th>السعر</th><th>المخزون</th><th>القسم</th><th>إجراءات</th></tr></thead><tbody id="productsTable"></tbody></table></div></section><section class="admin-section"><div class="head"><h2>الطلبات</h2><button class="btn outline small" id="reloadOrders">تحديث</button></div><div class="table-wrap"><table class="table"><thead><tr><th>الطلب</th><th>العميل</th><th>المكان</th><th>الإجمالي</th><th>الحالة</th></tr></thead><tbody id="ordersTable"></tbody></table></div></section></main></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>
const $=s=>document.querySelector(s),money=n=>"$"+Number(n).toFixed(2);const statuses=["جديد","قيد التجهيز","جاهز للتسليم","تم التسليم","ملغى"];
async function requireUser(){const {data}=await sb.auth.getSession();return data.session?.user||null}
async function load(){const {data:p,error:pe}=await sb.from("products").select("*").order("created_at",{ascending:false});if(pe)throw pe;const {data:o,error:oe}=await sb.from("orders").select("*,order_items(*)").order("created_at",{ascending:false});if(oe)throw oe;const orders=o||[],products=p||[];const revenue=orders.filter(x=>x.status!=="ملغى").reduce((s,x)=>s+Number(x.total),0),pending=orders.filter(x=>x.status==="جديد").length;$("#stats").innerHTML=`<div class="stat"><small>المنتجات</small><strong>${products.length}</strong></div><div class="stat"><small>كل الطلبات</small><strong>${orders.length}</strong></div><div class="stat"><small>طلبات جديدة</small><strong>${pending}</strong></div><div class="stat"><small>إجمالي الطلبات</small><strong>${money(revenue)}</strong></div>`;$("#productsTable").innerHTML=products.map(x=>`<tr><td>${x.icon||"🦷"} ${x.name}<br><small>${x.brand||""}</small></td><td>${money(x.price)}</td><td>${x.stock}</td><td>${x.category}</td><td><div class="admin-actions"><button class="btn small outline" onclick="editProduct('${x.id}')">تعديل</button><button class="btn small danger" onclick="deleteProduct('${x.id}')">حذف</button></div></td></tr>`).join("");$("#ordersTable").innerHTML=orders.map(x=>`<tr><td><b>${x.id}</b><br><small>${new Date(x.created_at).toLocaleString("ar-SY")}</small></td><td>${x.customer_name}<br>${x.customer_phone}</td><td>${x.customer_location}</td><td>${money(x.total)}</td><td><select class="status" onchange="setStatus('${x.id}',this.value)">${statuses.map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}
async function editProduct(id){const {data:d,error}=await sb.from("products").select("*").eq("id",id).single();if(error)throw error;const name=prompt("اسم المنتج",d.name);if(name===null)return;const price=prompt("السعر",d.price);if(price===null)return;const stock=prompt("المخزون",d.stock);if(stock===null)return;const {error:e}=await sb.from("products").update({name,price:Number(price),stock:Math.max(0,Math.floor(Number(stock)||0)),slug:(String(name).trim().toLowerCase().replace(/[^\w\u0600-\u06ff]+/g,"-")+"-"+Date.now().toString(36))}).eq("id",id);if(e)throw e;load()}
async function deleteProduct(id){if(!confirm("حذف المنتج؟"))return;const {error}=await sb.from("products").delete().eq("id",id);if(error)throw error;load()}
async function setStatus(id,status){const {error}=await sb.from("orders").update({status}).eq("id",id);if(error)alert(error.message);else load()}
$("#loginForm").onsubmit=async e=>{e.preventDefault();try{const {error}=await sb.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#password").value});if(error)throw error;await boot()}catch(err){$("#loginError").textContent=err.message}};
$("#logout").onclick=async()=>{await sb.auth.signOut();location.reload()};$("#productForm").onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);const data={name:String(f.get("name")),brand:String(f.get("brand")||""),category:f.get("category")==="البكجات"?"البكجات":"المواد",price:Number(f.get("price"))||0,stock:Math.max(0,Math.floor(Number(f.get("stock"))||0)),icon:String(f.get("icon")||"🦷"),description:String(f.get("description")||""),featured:f.get("featured")==="on",slug:String(f.get("name")).trim().toLowerCase().replace(/[^\w\u0600-\u06ff]+/g,"-")+"-"+Date.now().toString(36)};const {error}=await sb.from("products").insert(data);if(error)throw error;e.target.reset();load()}catch(err){alert(err.message)}};$("#reloadProducts").onclick=load;$("#reloadOrders").onclick=load;
async function boot(){const u=await requireUser();if(!u){$("#loginView").style.display="block";$("#adminView").style.display="none";return}$("#loginView").style.display="none";$("#adminView").style.display="block";try{await load()}catch(e){alert("تعذر تحميل لوحة التحكم: "+e.message)}}boot();
</script></body></html>
