<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنتج | MA Dental Supplies</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Montserrat:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="topbar">🚚 التوصيل حصرًا لجامعة دمشق والبرامكة حاليًا</div><header class="header"><div class="container"><a class="logo" href="index.html"><b>MA◡</b><small>Dental Supplies</small></a><nav class="nav"><a href="index.html">الرئيسية</a><a href="shop.html">المتجر</a><a href="index.html#bundles">البكجات</a><a href="track.html">تتبع الطلب</a></nav><div class="icons"><button class="icon-btn" id="cartButton">🛒<b class="cart-count" id="cartCount">0</b></button></div></div></header><main class="page"><div class="container"><div class="breadcrumb"><a href="index.html">الرئيسية</a> ← <a href="shop.html">المتجر</a> ← المنتج</div><div id="detail"></div></div></main><div class="drawer" id="drawer"><div class="drawer-head"><h3>سلة الطلب</h3><button id="closeDrawer">×</button></div><div id="cartItems"></div><div class="order-summary"><div><span>الإجمالي</span><strong id="cartTotal">$0.00</strong></div></div><a class="btn primary" style="width:100%" href="checkout.html">إتمام الطلب</a></div><div class="overlay" id="overlay"></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="app.js"></script><script>(async()=>{try{const id=new URLSearchParams(location.search).get("id");const p=await getProduct(id);if(!p)return $("#detail").innerHTML="<h2>المنتج غير موجود</h2>";products=[p];$("#detail").innerHTML=`<div class="detail"><div class="detail-img">${p.image_url?`<img src="${p.image_url}" alt="${p.name}">`:(p.icon||"🦷")}</div><div><span class="eyebrow">${p.category}</span><h1>${p.name}</h1><div class="brand">${p.brand}</div><div class="price">${money(p.price)}</div><div class="rating">★★★★★ <span>(${p.rating})</span></div><p>${p.description}</p><div class="stock">${p.stock>0?"متوفر حاليًا ✓":"غير متوفر حاليًا"}</div><button class="btn primary" style="margin-top:22px" onclick="add('${p.id}')">أضف للسلة 🛒</button></div></div>`;renderCart()}catch(e){console.error(e);$("#detail").innerHTML="<h2>تعذر تحميل المنتج</h2>"}})();</script></body></html>
