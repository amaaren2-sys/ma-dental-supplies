(async()=>{const params=new URLSearchParams(location.search),q=params.get("q")||"",cat=params.get("category")||"";$("#shopSearch").value=q;const d=await getProducts("?q="+encodeURIComponent(q)+"&category="+encodeURIComponent(cat));$("#shopGrid").innerHTML=d.products.map(productCard).join("")||"<p>لا توجد منتجات مطابقة.</p>";if(cat) $("#categorySelect").value=cat;$("#categorySelect").onchange=e=>location.href="/shop.html?category="+encodeURIComponent(e.target.value);$("#shopSearch").onkeydown=e=>{if(e.key==="Enter")location.href="/shop.html?q="+encodeURIComponent(e.target.value)};$(".search button").onclick=()=>location.href="/shop.html?q="+encodeURIComponent($("#shopSearch").value);})();
