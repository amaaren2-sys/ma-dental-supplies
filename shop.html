<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المتجر | MA Dental Supplies</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Montserrat:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<div class="topbar">🚚 التوصيل حصرًا لجامعة دمشق والبرامكة حاليًا</div><header class="header"><div class="container"><a class="logo" href="index.html"><b>MA◡</b><small>Dental Supplies</small></a><div class="search"><input id="shopSearch" placeholder="ابحث عن منتج أو شركة..."><button>⌕</button></div><nav class="nav"><a href="index.html">الرئيسية</a><a href="shop.html">المتجر</a><a href="index.html#bundles">البكجات</a><a href="track.html">تتبع الطلب</a><a href="index.html#community">مجتمع MA</a></nav><div class="icons"><a class="icon-btn favorite-header" href="favorites.html" aria-label="المفضلة">♥<b class="cart-count favorite-count" id="favoriteCount">0</b></a><button class="icon-btn" id="cartButton">🛒<b class="cart-count" id="cartCount">0</b></button></div></div></header>
<main class="page"><div class="container"><div class="head"><div><span class="eyebrow">MA Dental Supplies</span><h2>المتجر 🛒</h2><div id="resultsCount" class="results-count"></div></div></div><div class="shop-toolbar"><input id="filterBrand" placeholder="فلترة حسب الشركة..."><select id="categorySelect"><option value="">المواد والبكجات</option><option value="المواد">المواد</option><option value="البكجات">البكجات</option></select><select id="sortSelect"><option value="new">الأحدث</option><option value="priceAsc">السعر: من الأقل</option><option value="priceDesc">السعر: من الأعلى</option><option value="name">الاسم</option><option value="stock">المتوفر أولًا</option></select></div><div class="product-grid" id="shopGrid"></div><div class="pagination" id="pagination"></div></div></main>
<div class="drawer" id="drawer"><div class="drawer-head"><h3>سلة الطلب</h3><button id="closeDrawer">×</button></div><div id="cartItems"></div><div class="order-summary"><div><span>الإجمالي</span><strong id="cartTotal">$0.00</strong></div></div><a class="btn primary" style="width:100%" href="checkout.html">إتمام الطلب</a></div><div class="overlay" id="overlay"></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="app.js"></script><script>
(async()=>{const params=new URLSearchParams(location.search);let q=params.get('q')||'',cat=params.get('category')||'',brand=params.get('brand')||'',page=Number(params.get('page')||1);const perPage=24;$('#shopSearch').value=q;$('#filterBrand').value=brand;$('#categorySelect').value=cat;const d=await getProducts('?q='+encodeURIComponent(q)+'&category='+encodeURIComponent(cat));let all=d.products;function render(){let list=all.filter(p=>!brand||String(p.brand||'').toLowerCase().includes(brand.toLowerCase()));const sort=$('#sortSelect').value;if(sort==='priceAsc')list.sort((a,b)=>a.price-b.price);if(sort==='priceDesc')list.sort((a,b)=>b.price-a.price);if(sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'ar'));if(sort==='stock')list.sort((a,b)=>b.stock-a.stock);const pages=Math.max(1,Math.ceil(list.length/perPage));if(page>pages)page=pages;const slice=list.slice((page-1)*perPage,page*perPage);$('#resultsCount').textContent=`${list.length} منتج • الصفحة ${page} من ${pages}`;$('#shopGrid').innerHTML=slice.map(productCard).join('')||'<p>لا توجد منتجات مطابقة.</p>';$('#pagination').innerHTML=Array.from({length:pages},(_,i)=>`<button class="${i+1===page?'active':''}" onclick="go(${i+1})">${i+1}</button>`).join('')}window.go=p=>{page=p;render();scrollTo({top:0,behavior:'smooth'})};$('#sortSelect').onchange=()=>{page=1;render()};$('#filterBrand').onkeydown=e=>{if(e.key==='Enter'){brand=e.target.value;page=1;render()}};$('#categorySelect').onchange=e=>{location.href='shop.html?category='+encodeURIComponent(e.target.value)};$('#shopSearch').onkeydown=e=>{if(e.key==='Enter')location.href='shop.html?q='+encodeURIComponent(e.target.value)};$('.search button').onclick=()=>location.href='shop.html?q='+encodeURIComponent($('#shopSearch').value);render()})().catch(e=>{console.error(e);$('#shopGrid').innerHTML='<div class="error-box">تعذر تحميل المنتجات. تأكد من اتصال Supabase.</div>'});
</script></body></html>
