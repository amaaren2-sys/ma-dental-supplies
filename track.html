<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تتبع الطلب | MA Dental Supplies</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Montserrat:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="topbar">🚚 التوصيل حصرًا لجامعة دمشق والبرامكة حاليًا</div><header class="header"><div class="container"><a class="logo" href="index.html"><b>MA◡</b><small>Dental Supplies</small></a><nav class="nav"><a href="index.html">الرئيسية</a><a href="shop.html">المتجر</a><a href="index.html#bundles">البكجات</a><a href="track.html">تتبع الطلب</a><a href="index.html#community">مجتمع MA</a></nav><div class="icons"><a class="icon-btn" href="shop.html">🛒</a></div></div></header><main class="page"><div class="container track-page"><div class="track-card"><span class="eyebrow">MA Dental Supplies</span><h1>تتبع طلبك 📦</h1><p>أدخل رقم الطلب ورقم الهاتف المستخدم عند الطلب.</p><form id="trackForm" class="track-form"><div class="field"><label>رقم الطلب</label><input id="orderId" placeholder="مثال: MA-17" required></div><div class="field"><label>رقم الهاتف</label><input id="phone" placeholder="09xxxxxxxx" required></div><button class="btn primary" type="submit">تتبع الطلب</button></form><div id="trackResult"></div></div></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>
const $=s=>document.querySelector(s),money=n=>"$"+Number(n).toFixed(2);const steps=["جديد","قيد التجهيز","جاهز للتسليم","تم التسليم"];
function render(o){const idx=steps.indexOf(o.status);const items=(o.items||[]).map(i=>`<div class="track-item"><span>${i.name} × ${i.qty}</span><strong>${money(i.price*i.qty)}</strong></div>`).join("");return `<div class="track-result"><div class="track-head"><div><small>رقم الطلب</small><strong>${o.id}</strong></div><div><small>الحالة</small><strong>${o.status}</strong></div></div><div class="status-steps">${steps.map((s,i)=>`<div class="status-step ${i<=idx?'done':''} ${s===o.status?'current':''}"><span>${i<idx?'✓':i+1}</span><small>${s}</small></div>`).join("")}</div><div class="track-info"><div><small>مكان الاستلام</small><strong>${o.customer_location}</strong></div><div><small>تاريخ الطلب</small><strong>${new Date(o.created_at).toLocaleString('ar-SY')}</strong></div></div><div class="track-items">${items}</div><div class="track-total"><span>الإجمالي</span><strong>${money(o.total)}</strong></div>${o.notes?`<div class="order-notes"><small>ملاحظات</small><p>${o.notes}</p></div>`:''}</div>`}
$('#trackForm').onsubmit=async e=>{e.preventDefault();const id=$('#orderId').value.trim().toUpperCase(),phone=$('#phone').value.trim();$('#trackResult').innerHTML='<div class="loading">جارٍ البحث...</div>';const {data,error}=await sb.rpc('get_order_status',{p_order_id:id,p_customer_phone:phone});if(error||!data){$('#trackResult').innerHTML='<div class="error-box">لم يتم العثور على طلب مطابق. تأكد من رقم الطلب ورقم الهاتف.</div>';return}$('#trackResult').innerHTML=render(data)};
</script></body></html>
