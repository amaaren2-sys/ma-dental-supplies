<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إتمام الطلب | MA Dental Supplies</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Montserrat:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="topbar">🚚 التوصيل حصرًا لجامعة دمشق والبرامكة حاليًا</div><header class="header"><div class="container"><a class="logo" href="index.html"><b>MA◡</b><small>Dental Supplies</small></a><nav class="nav"><a href="index.html">الرئيسية</a><a href="shop.html">المتجر</a></nav><div class="icons"><a class="icon-btn" href="shop.html">←</a></div></div></header><main class="page"><div class="container checkout"><div class="form"><span class="eyebrow">MA Dental Supplies</span><h1>إتمام الطلب</h1><p style="font-size:11px;color:#81798d">الدفع عند الاستلام: كاش، شام كاش أو عملات أجنبية.</p><form id="orderForm"><div class="fields"><div class="field"><label>الاسم الكامل *</label><input name="name" required></div><div class="field"><label>رقم الهاتف *</label><input name="phone" required></div><div class="field full"><label>مكان الاستلام *</label><select name="location" required><option value="">اختر</option><option>جامعة دمشق</option><option>البرامكة</option></select></div><div class="field full"><label>ملاحظات</label><textarea name="notes" placeholder="أي ملاحظات إضافية على الطلب..."></textarea></div></div><div class="order-summary" id="summary"></div><button class="btn primary" style="width:100%" type="submit">تأكيد الطلب</button></form><div id="result"></div></div></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="app.js"></script><script>
(async()=>{try{await getProducts();const summary=$("#summary");function draw(){const valid=cart.map(i=>({...i,p:products.find(p=>p.id===i.id)})).filter(x=>x.p);if(!valid.length){summary.innerHTML="<strong>السلة فارغة.</strong> <a href='shop.html' style='color:#57369a'>العودة للمتجر</a>";return}summary.innerHTML=valid.map(x=>`<div><span>${x.p.name} × ${x.qty}</span><strong>${money(x.p.price*x.qty)}</strong></div>`).join("")+`<hr><div><strong>الإجمالي</strong><strong>${money(valid.reduce((s,x)=>s+x.p.price*x.qty,0))}</strong></div>`}draw();$("#orderForm").onsubmit=async e=>{e.preventDefault();if(!cart.length)return alert("السلة فارغة");const f=new FormData(e.target);const customer={name:String(f.get("name")||"").trim(),phone:String(f.get("phone")||"").trim(),location:String(f.get("location")||"")};const items=cart.map(i=>({id:i.id,qty:i.qty}));const {data,error}=await sb.rpc("create_order",{p_customer_name:customer.name,p_customer_phone:customer.phone,p_customer_location:customer.location,p_notes:String(f.get("notes")||""),p_items:items});if(error){console.error(error);return alert(error.message||"تعذر إنشاء الطلب")}const order=data;const text=order.items.map(i=>`• ${i.name} × ${i.qty} = ${money(i.price*i.qty)}`).join("%0A");const num=(window.MA_CONFIG.WHATSAPP_NUMBER||"").replace(/\D/g,"");const notes=String(f.get("notes")||"").trim();const msg=`مرحبًا MA Dental Supplies%0Aرقم الطلب: ${encodeURIComponent(order.id)}%0Aالاسم: ${encodeURIComponent(customer.name)}%0Aالهاتف: ${encodeURIComponent(customer.phone)}%0Aالمكان: ${encodeURIComponent(customer.location)}%0A%0A${text}%0A%0Aالإجمالي: ${money(order.total)}${notes?`%0Aملاحظات: ${encodeURIComponent(notes)}`:""}`;cart=[];saveCart();$("#orderForm").style.display="none";const wa=num?`https://wa.me/${num}?text=${msg}`:"#";$("#result").innerHTML=`<div class="success"><h3>تم تسجيل طلبك ✓</h3><p>رقم الطلب: <b>${order.id}</b></p><p>تم حفظ الطلب بنجاح وسيتم التواصل معك.</p><a href="track.html" class="btn outline" style="margin:8px">تتبع الطلب</a>${num?`<a class="btn primary" href="${wa}" target="_blank">فتح WhatsApp وإرسال الطلب</a>`:"<p>سيتم التواصل معك بعد مراجعة الطلب.</p>"}</div>`};}catch(e){console.error(e);alert("تعذر الاتصال بقاعدة البيانات. تأكد من إعداد Supabase.")}})();
</script></body></html>
