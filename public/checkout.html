<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إتمام الطلب | MA Dental Supplies</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Montserrat:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body><div class="topbar">🚚 التوصيل حصرًا لجامعة دمشق والبرامكة حاليًا</div><header class="header"><div class="container"><a class="logo" href="/"><b>MA◡</b><small>Dental Supplies</small></a><nav class="nav"><a href="/">الرئيسية</a><a href="/shop.html">المتجر</a></nav><div class="icons"><a class="icon-btn" href="/shop.html">←</a></div></div></header><main class="page"><div class="container checkout"><div class="form"><span class="eyebrow">MA Dental Supplies</span><h1>إتمام الطلب</h1><p style="font-size:11px;color:#81798d">الدفع عند الاستلام: كاش، شام كاش أو عملات أجنبية.</p><form id="orderForm"><div class="fields"><div class="field"><label>الاسم الكامل *</label><input name="name" required></div><div class="field"><label>رقم الهاتف *</label><input name="phone" required></div><div class="field full"><label>مكان الاستلام *</label><select name="location" required><option value="">اختر</option><option>جامعة دمشق</option><option>البرامكة</option></select></div><div class="field full"><label>ملاحظات</label><textarea name="notes" placeholder="أي ملاحظات إضافية على الطلب..."></textarea></div></div><div class="order-summary" id="summary"></div><button class="btn primary" style="width:100%" type="submit">تأكيد الطلب وإرسال التفاصيل عبر WhatsApp</button></form><div id="result"></div></div></div></main><script src="/app.js"></script><script>
(async()=>{await getProducts();const summary=$("#summary");function draw(){const valid=cart.map(i=>({...i,p:products.find(p=>p.id===i.id)})).filter(x=>x.p);if(!valid.length){summary.innerHTML="<strong>السلة فارغة.</strong> <a href='/shop.html' style='color:#57369a'>العودة للمتجر</a>";return}summary.innerHTML=valid.map(x=>`<div><span>${x.p.name} × ${x.qty}</span><strong>${money(x.p.price*x.qty)}</strong></div>`).join("")+`<hr><div><strong>الإجمالي</strong><strong>${money(valid.reduce((s,x)=>s+x.p.price*x.qty,0))}</strong></div>`}draw();$("#orderForm").onsubmit=async e=>{e.preventDefault();if(!cart.length)return alert("السلة فارغة");const f=new FormData(e.target),data={customer:{name:f.get("name"),phone:f.get("phone"),location:f.get("location")},notes:f.get("notes"),items:cart};const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)return alert(d.error||"تعذر إنشاء الطلب");const text=d.order.items.map(i=>`• ${i.name} × ${i.qty} = ${money(i.price*i.qty)}`).join("%0A");const msg=`مرحبًا MA Dental Supplies%0Aرقم الطلب: ${d.order.id}%0Aالاسم: ${encodeURIComponent(d.order.customer.name)}%0Aالهاتف: ${encodeURIComponent(d.order.customer.phone)}%0Aالمكان: ${encodeURIComponent(d.order.customer.location)}%0A%0A${text}%0A%0Aالإجمالي: ${money(d.order.total)}`;cart=[];saveCart();$("#orderForm").style.display="none";$("#result").innerHTML=`<div class="success"><h3>تم تسجيل طلبك ✓</h3><p>رقم الطلب: <b>${d.order.id}</b></p><p>سيتم تجهيز الطلب والتواصل معك.</p><a class="btn primary" href="https://wa.me/${d.whatsappNumber}?text=${msg}" target="_blank">فتح WhatsApp وإرسال الطلب</a></div>`;}})();
</script></body></html>
