<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم | MA Dental Supplies</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Montserrat:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body class="admin-wrap"><div id="loginView" class="login"><h1>MA Dental Supplies</h1><p>دخول لوحة التحكم</p><form id="loginForm"><div class="field"><label>كلمة المرور</label><input id="password" type="password" required></div><button class="btn primary" style="width:100%;margin-top:15px">دخول</button></form><p id="loginError" style="color:#a62e50;font-size:10px"></p></div><div id="adminView" style="display:none"><div class="admin-nav"><strong>MA Dental Supplies — لوحة التحكم</strong><button class="btn outline small" id="logout">تسجيل الخروج</button></div><main class="admin"><div class="dash-grid" id="stats"></div><section class="admin-section"><div class="head"><h2>إضافة منتج</h2></div><form class="admin-form" id="productForm"><input name="name" placeholder="اسم المنتج" required><input name="brand" placeholder="العلامة التجارية"><input name="category" placeholder="القسم: المواد أو البكجات" value="المواد"><input name="price" type="number" step="0.01" placeholder="السعر" required><input name="stock" type="number" placeholder="المخزون" value="0"><input name="icon" placeholder="إيموجي المنتج" value="🦷"><textarea name="description" placeholder="وصف المنتج"></textarea><label style="font-size:10px"><input name="featured" type="checkbox"> الأكثر طلبًا</label><button class="btn primary">إضافة المنتج</button></form></section><section class="admin-section"><div class="head"><h2>المنتجات</h2><button class="btn outline small" id="reloadProducts">تحديث</button></div><div class="table-wrap"><table class="table"><thead><tr><th>المنتج</th><th>السعر</th><th>المخزون</th><th>القسم</th><th>إجراءات</th></tr></thead><tbody id="productsTable"></tbody></table></div></section><section class="admin-section"><div class="head"><h2>الطلبات</h2><button class="btn outline small" id="reloadOrders">تحديث</button></div><div class="table-wrap"><table class="table"><thead><tr><th>الطلب</th><th>العميل</th><th>المكان</th><th>الإجمالي</th><th>الحالة</th></tr></thead><tbody id="ordersTable"></tbody></table></div></section></main></div><script>
const $=s=>document.querySelector(s);const money=n=>"$"+Number(n).toFixed(2);
async function api(path,opt={}){const r=await fetch(path,opt);const d=await r.json();if(!r.ok)throw Error(d.error||"خطأ");return d}
async function check(){const d=await api("/api/admin/me");if(d.authenticated){$("#loginView").style.display="none";$("#adminView").style.display="block";load()}else{$("#loginView").style.display="block";$("#adminView").style.display="none"}}
async function load(){const [s,p,o]=await Promise.all([api("/api/admin/stats"),api("/api/products"),api("/api/admin/orders")]);$("#stats").innerHTML=`<div class="stat"><small>المنتجات</small><strong>${s.products}</strong></div><div class="stat"><small>كل الطلبات</small><strong>${s.orders}</strong></div><div class="stat"><small>طلبات جديدة</small><strong>${s.pending}</strong></div><div class="stat"><small>إجمالي الطلبات</small><strong>${money(s.revenue)}</strong></div>`;$("#productsTable").innerHTML=p.products.map(x=>`<tr><td>${x.icon} ${x.name}<br><small>${x.brand}</small></td><td>${money(x.price)}</td><td>${x.stock}</td><td>${x.category}</td><td><div class="admin-actions"><button class="btn small outline" onclick="editProduct('${x.id}')">تعديل</button><button class="btn small danger" onclick="deleteProduct('${x.id}')">حذف</button></div></td></tr>`).join("");$("#ordersTable").innerHTML=o.map(x=>`<tr><td><b>${x.id}</b><br><small>${new Date(x.createdAt).toLocaleString("ar-SY")}</small></td><td>${x.customer.name}<br>${x.customer.phone}</td><td>${x.customer.location}</td><td>${money(x.total)}</td><td><select class="status" onchange="setStatus('${x.id}',this.value)">${["جديد","قيد التجهيز","جاهز للتسليم","تم التسليم","ملغى"].map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}
async function editProduct(id){const d=await api("/api/products/"+id);const name=prompt("اسم المنتج",d.name);if(name===null)return;const price=prompt("السعر",d.price);const stock=prompt("المخزون",d.stock);await api("/api/admin/products/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,price,stock})});load()}
async function deleteProduct(id){if(!confirm("حذف المنتج؟"))return;await api("/api/admin/products/"+id,{method:"DELETE"});load()}
async function setStatus(id,status){await api("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});load()}
$("#loginForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#password").value})});check()}catch(err){$("#loginError").textContent=err.message}};
$("#logout").onclick=async()=>{await api("/api/admin/logout",{method:"POST"});check()};$("#productForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const data=Object.fromEntries(f.entries());data.featured=f.get("featured")==="on";await api("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});e.target.reset();load()};$("#reloadProducts").onclick=load;$("#reloadOrders").onclick=load;check();
</script></body></html>
