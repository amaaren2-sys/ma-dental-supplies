script>async function renderFavoritesPage(){const grid=document.getElementById("favoritesGrid");if(!grid)return;const ids=favorites();document.getElementById("favoritesCountText").textContent=`${ids.length} منتج محفوظ`;if(!ids.length){grid.innerHTML='<div class="empty-favorites"><div>♡</div><h3>ما عندك منتجات مفضلة بعد</h3><p>اضغط على ❤️ بجانب أي منتج لحفظه هنا.</p><a class="btn primary" href="shop.html">تصفح المنتجات</a></div>';return}const {data,error}=await sb.from("products").select("id,name,slug,brand,category,price,stock,rating,icon,image_url,description,featured").in("id",ids);if(error){grid.innerHTML='<div class="error-box">تعذر تحميل المفضلة.</div>';return}const map=new Map((data||[]).map(p=>[p.id,p]));products=ids.map(id=>map.get(id)).filter(Boolean);grid.innerHTML=products.map(productCard).join("");updateFavoriteCount()}document.addEventListener("DOMContentLoaded",async()=>{await renderFavoritesPage();});</script></body></html>
